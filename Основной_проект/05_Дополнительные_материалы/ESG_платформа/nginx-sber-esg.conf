location = /sber-esg { return 308 /sber-esg/; }
location ^~ /sber-esg/ {
    auth_basic "ESG review";
    auth_basic_user_file /etc/nginx/sber-esg.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:18496/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
}
